name: sync-cloudkit

# Upstream drift watch for extractor-cloudkit.
#
# The ports in extractor-cloudkit derive from recloudstream/cloudstream
# files pinned in extractor-cloudkit/upstream-manifest.txt. This job
# re-downloads those files weekly and FAILS when upstream changes, so a
# protocol change upstream never silently breaks a port: the red run is
# the signal to review the diff and re-port the affected extractor.
#
# A red run here does NOT mean the build is broken — it means an
# upstream file moved and the port must be re-verified.

on:
  schedule:
    # Sundays 06:30 UTC, quiet hours for the repo's timezone audience.
    - cron: '30 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare upstream files against the pinned manifest
        working-directory: extractor-cloudkit
        env:
          UPSTREAM_BASE: https://raw.githubusercontent.com/recloudstream/cloudstream/master/library/src/commonMain/kotlin/com/lagradost/cloudstream3
          MANIFEST: upstream-manifest.txt
        run: |
          set -eu
          # Skip comment lines; each record: <sha256>  <path>
          total=0; drifted=0
          while read -r expected path; do
            [ -z "${expected:-}${path:-}" ] && continue
            total=$((total + 1))
            actual="$(curl -fsSL --retry 3 "$UPSTREAM_BASE/$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" = "$expected" ]; then
              echo "OK    $path"
            else
              drifted=$((drifted + 1))
              echo "DRIFT $path"
              echo "  manifest (pinned): $expected"
              echo "  upstream (now):    $actual"
              echo "  diff: $UPSTREAM_BASE/$path"
            fi
          done < <(grep -vE '^\s*#|^\s*$' "$MANIFEST" | awk '{print $1, $2}')

          echo
          echo "checked=$total drifted=$drifted"
          if [ "$drifted" -gt 0 ]; then
            echo
            echo "::error::Upstream drifted for $drifted/$total files pinned in extractor-cloudkit/upstream-manifest.txt — re-port and re-verify the affected extractors (fixture test + live validation), then update the manifest."
            exit 1
          fi
          echo "All pinned upstream files unchanged."

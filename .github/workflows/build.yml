name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-24.04 image ships the Android SDK with licenses accepted;
      # AGP auto-installs any missing platform/build-tools via sdkmanager.

      - name: Build and test
        run: ./gradlew :core:assembleDebug :core:assembleRelease :core:testDebugUnitTest :core:testReleaseUnitTest --no-daemon --stacktrace

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: core-aar
          path: core/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/**
            core/build/intermediates/**/lint-results*.xml
          if-no-files-found: warn
